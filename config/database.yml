# PostgreSQL. Versions 9.3 and up are supported.
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: grain_market_crm_development

test:
  <<: *default
  database: grain_market_crm_test

# On Render, DATABASE_URL is provided automatically when you attach a
# Postgres database to this service. Rails will use it directly and
# ignore the "database:" key below. Free tier = one database, so we
# point primary/cache/queue/cable all at the same connection.
production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *primary_production
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    migrations_paths: db/cable_migrate
