databases:
  - name: grain-market-crm-db
    plan: free
    databaseName: grain_market_crm_production
    user: grain_market_crm

services:
  - type: web
    name: grain-market-crm
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bin/rails server"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: grain-market-crm-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "5"
